name : geoguess
services:

  nginx:
    build: ./image/nginx
    restart: always
    depends_on:
      - backend
      - frontend

    ports:
      - "${NGINX_PORT}:443"
    networks:
      - geoguess

    env_file:
      - .env
    volumes:
      - backend_static:/app/backend/staticfiles
      - backend_media:/app/backend/media
      - certificates:/etc/nginx/ssl

  postgres:
    build: 
      context: ./image/postgres
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION}
    volumes:
      - postgres:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - geoguess
    env_file:
      - .env
    restart: always
    healthcheck:
      # -h 127.0.0.1 força TCP: só passa quando o servidor final está no ar
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_period: 40s

  backend:
    build: ./image/backend
    restart: always
    
    depends_on:
      - postgres

    env_file:
    - .env
    secrets:
      - postgres_password

    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media

    networks:
      - geoguess
 

  redis:
    build: ./image/redis
    restart: always
    depends_on:
      - backend
    
    networks:
      - geoguess


  frontend:
    build: ./image/frontend
    restart: always
    env_file:
      - .env

    depends_on:
      - backend

    networks:
      - geoguess


  adminer:
    build: ./image/adminer
    restart: always
    depends_on:
      - postgres

    environment:
      ADMINER_DEFAULT_SERVER: postgres
 
    networks:
      - geoguess

  backup:
    build:
      context: ./image/backup
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION}
    restart: always
    depends_on:
      - postgres
    env_file: [.env]
    secrets: [postgres_password]
    volumes:
      - backups:/backups
      - backend_media:/app/media
    networks: [geoguess]
    healthcheck:
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 3m
      # saudável se houve backup com sucesso nas últimas 2 janelas
      test: ["CMD-SHELL", "test -n \"$$(find /backups/last_backup.ok -mmin -$$((($${BACKUP_INTERVAL_HOURS:-24}) * 120)) 2>/dev/null)\""]

  status:
    build: ./image/status
    restart: always
    env_file: [.env]
    volumes:
      - backups:/backups
    networks: [geoguess]

volumes:
  postgres:
    name: ${VOLUMES_POSTGRES}
    driver_opts:
      type: "none"
      o: bind
      device: ${VOLUMES_ROOT}/postgres

  backend_static:
    name: ${VOLUMES_STATIC}
    driver_opts:
      type: "none"
      o: bind
      device: ${VOLUMES_ROOT}/static

  backend_media:
    name: ${VOLUMES_MEDIA}
    driver_opts:
      type: "none"
      o: bind
      device: ${VOLUMES_ROOT}/media

  certificates:
    name: ${VOLUMES_CERTIFICATES}
    driver_opts:
      type: "none"
      o: bind
      device: ${VOLUMES_ROOT}/certificates

  backups:
    name: backups
    driver_opts: 
      type: "none"
      o: bind
      device: "${VOLUMES_BACKUPS}"

secrets:
  postgres_password:
    file: ../secrets/postgres_password.txt

networks:
  geoguess:
    driver: bridge