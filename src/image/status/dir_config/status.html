<!doctype html>
<html lang="pt">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="15">
    <title>Health check status page system — GeoGuess Angola</title>
    <style>
        :root {
            --color-black: #080808;
            --color-dark-red: #250609;
            --color-crimson: #650D19;
            --color-white: #FFFFFF;
            --color-gold: #FFC629;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, sans-serif;
            color: var(--color-white);
            background: linear-gradient(135deg,
                    var(--color-black) 0%,
                    var(--color-dark-red) 55%,
                    var(--color-black) 100%);
        }

        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0 0 1rem;
            color: var(--color-gold);
        }

        .banner {
            padding: .9rem 1.1rem;
            border-radius: 10px;
            font-weight: 600;
            margin: 1rem 0 1.5rem;
        }

        .banner.ok {
            background: var(--color-crimson);
            color: var(--color-white);
        }

        .banner.bad {
            background: var(--color-gold);
            color: var(--color-black);
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 10px;
            background: rgba(255, 255, 255, .04);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: .7rem .9rem;
            text-align: left;
            vertical-align: top;
        }

        thead th {
            color: var(--color-gold);
            font-size: .78rem;
            text-transform: uppercase;
            letter-spacing: .06em;
            border-bottom: 1px solid var(--color-gold);
        }

        tbody td {
            border-bottom: 1px solid rgba(255, 255, 255, .1);
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        .pill {
            display: inline-block;
            padding: .15rem .6rem;
            border-radius: 999px;
            font-size: .85rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .pill.ok {
            color: var(--color-gold);
            border: 1px solid var(--color-gold);
        }

        .pill.bad {
            color: var(--color-white);
            background: var(--color-crimson);
            border: 1px solid var(--color-white);
        }

        .detail {
            display: block;
            margin-top: .25rem;
            opacity: .65;
            font-size: .78rem;
        }

        code {
            color: var(--color-gold);
            font-size: .85rem;
        }

        footer {
            margin-top: 1rem;
            opacity: .6;
            font-size: .8rem;
        }
    </style>
</head>

<body>
    <main>
        <h1>Health Check Status Page System</h1>
        <h2>Geoguess Angola</h2>
        <div class="banner $banner_class">$banner</div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th scope="col">Serviço</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Tipo de conexão</th>
                    </tr>
                </thead>
                <tbody>
                    $rows
                </tbody>
            </table>
        </div>
        <footer>Atualiza a cada 15 s · $updated</footer>
    </main>
</body>

</html>
