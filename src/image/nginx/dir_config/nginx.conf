user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { 
    worker_connections 1024; 
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS interno do Docker: o nginx não falha se um serviço ainda não existir
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 443 ssl http2;
        server_name ${DOMAIN_NAME};

        ssl_certificate     /etc/nginx/ssl/geoguess.crt;
        ssl_certificate_key /etc/nginx/ssl/geoguess.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header X-Content-Type-Options nosniff always;

        # ---------- Django API ----------
        location /api/ {
            set $backend http://backend:8000;
            include proxy_params;
            proxy_pass $backend;
        }

        # ---------- Django admin ----------
        location /admin/ {
            set $backend http://backend:8000;
            include proxy_params;
            proxy_pass $backend;
        }

        # ---------- Ficheiros estáticos e media (volumes) ----------
        location /static/ {
            alias /app/backend/staticfiles/;
            expires 7d;
            access_log off;
        }

        location /media/ {
            alias /app/backend/media/;
            expires 7d;
        }

        # ---------- Adminer (reverse proxy em /adminer/) ----------
        location = /adminer { return 301 /adminer/; }

        location /adminer/ {
            # allow 127.0.0.1; deny all;   # descomenta para restringir o acesso
            set $adminer http://adminer:8080;
            include proxy_params;
            rewrite ^/adminer/(.*)$ /$1 break;
            proxy_pass $adminer;
        }

        # ---------- Frontend React + Vite (com HMR por websocket) ----------
        location / {
            set $frontend http://frontend:5173;
            include proxy_params;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_pass $frontend;
        }
    }
}
